<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property & BPO Management</title><style>body{font-family:Inter,Arial;background:#f6f7fb;max-width:1000px;margin:40px auto;padding:20px}.cards{display:flex;gap:15px;flex-wrap:wrap}.card{background:#fff;padding:20px;border-radius:16px;min-width:180px;box-shadow:0 5px 20px #0001}button{padding:12px;border:0;border-radius:10px;cursor:pointer}</style></head><body><h1>Property & BPO Management</h1><p>Operations dashboard</p><div id="cards" class="cards"></div><button onclick="load()">Refresh dashboard</button><script>async function load(){let x=await (await fetch('/dashboard')).json();cards.innerHTML=Object.entries(x).map(([k,v])=>'<div class="card"><b>'+k.replaceAll('_',' ')+'</b><h2>'+v+'</h2></div>').join('')}load()</script></body></html>
